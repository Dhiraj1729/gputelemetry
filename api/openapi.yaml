components:
  schemas:
    Datapoint:
      additionalProperties: false
      properties:
        container:
          type: string
        event_id:
          type: string
        gpu_uuid:
          type: string
        ingested_at:
          description: First successful database insert time
          format: date-time
          type: string
        labels_raw:
          type: string
        metric_name:
          type: string
        namespace:
          type: string
        pod:
          type: string
        processed_at:
          description: Streamer-assigned timestamp used for ordering and filtering
          format: date-time
          type: string
        source_timestamp:
          description: Original CSV timestamp
          format: date-time
          type: string
        value:
          format: double
          type: number
      required:
        - event_id
        - gpu_uuid
        - metric_name
        - value
        - processed_at
        - source_timestamp
        - ingested_at
        - labels_raw
        - container
        - pod
        - namespace
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GPU:
      additionalProperties: false
      properties:
        device:
          type: string
        first_seen:
          format: date-time
          type: string
        hostname:
          type: string
        last_seen:
          format: date-time
          type: string
        local_gpu_id:
          type: string
        model_name:
          type: string
        uuid:
          description: GPU UUID; local GPU IDs are not globally unique
          type: string
      required:
        - uuid
        - hostname
        - local_gpu_id
        - device
        - model_name
        - first_seen
        - last_seen
      type: object
    HealthBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
info:
  description: Read-only persisted GPU telemetry. Inclusive processed_at filters, complete arrays and no pagination. Query/resource failures return 503 before a success body begins.
  title: GPU Telemetry API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/gpus:
    get:
      operationId: list-gpus
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GPU"
                type: array
          description: Complete ordered JSON array; empty results are []. No row limit. Requests exceeding the configured query or response disk budget fail with 503.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: List all GPUs with telemetry
  /api/v1/gpus/{id}/telemetry:
    get:
      operationId: get-gpu-telemetry
      parameters:
        - description: GPU UUID, not the host-local GPU index
          in: path
          name: id
          required: true
          schema:
            description: GPU UUID, not the host-local GPU index
            type: string
        - description: Optional inclusive lower processed_at bound; RFC3339
          explode: false
          in: query
          name: start_time
          schema:
            description: Optional inclusive lower processed_at bound; RFC3339
            format: date-time
            type: string
        - description: Optional inclusive upper processed_at bound; RFC3339
          explode: false
          in: query
          name: end_time
          schema:
            description: Optional inclusive upper processed_at bound; RFC3339
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Datapoint"
                type: array
          description: Complete ordered JSON array; empty results are []. No row limit. Requests exceeding the configured query or response disk budget fail with 503.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Read all matching telemetry ordered by processed_at and event_id
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Process liveness
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: PostgreSQL and schema readiness
