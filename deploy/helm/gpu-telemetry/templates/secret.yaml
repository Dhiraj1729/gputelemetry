{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.developmentSecret }}{{ fail "Set database.existingSecret or explicitly enable database.developmentSecret for local use" }}{{ end }}
{{- $name := printf "%s-database" (include "gpu.fullname" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 48 }}
{{- $url := "" }}
{{- if $old }}
{{- $password = index $old.data "postgres-password" | b64dec }}
{{- $url = index $old.data "database-url" | b64dec }}
{{- else }}
{{- $url = printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.database.username $password (include "gpu.fullname" .) .Values.database.name }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
  database-url: {{ $url | b64enc | quote }}
{{- end }}
