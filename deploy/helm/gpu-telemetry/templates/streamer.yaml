{{- if not .Values.bootstrapOnly }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu.fullname" . }}-streamer
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streamer.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "gpu.selector" (dict "root" . "component" "streamer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu.selector" (dict "root" . "component" "streamer") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "gpu.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: streamer
          image: {{ include "gpu.image" (dict "root" . "component" "streamer") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "gpu.containerSecurity" . | nindent 12 }}
          args:
            - '--csv=/app/data/metrics.csv'
            - '--queue-url=http://{{ include "gpu.fullname" . }}-queue:8081'
            - '--rate={{ .Values.streamer.rate }}'
            - '--count={{ .Values.streamer.count }}'
            - '--shutdown-timeout=20s'
          resources:
            {{- toYaml .Values.streamer.resources | nindent 12 }}
{{- end }}
