{{- if not .Values.bootstrapOnly }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu.fullname" . }}-collector
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.collector.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "gpu.selector" (dict "root" . "component" "collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu.selector" (dict "root" . "component" "collector") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "gpu.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "gpu.image" (dict "root" . "component" "collector") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "gpu.containerSecurity" . | nindent 12 }}
          args:
            - '--listen=:8082'
            - '--queue-url=http://{{ include "gpu.fullname" . }}-queue:8081'
            - '--workers={{ .Values.collector.workers }}'
            - '--pool-max={{ .Values.collector.poolMax }}'
            - '--work-timeout={{ .Values.collector.workTimeout }}'
            - '--shutdown-timeout=20s'
          env:
            {{- include "gpu.databaseEnv" . | nindent 12 }}
          ports: [{name: http, containerPort: 8082}]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
{{- end }}
