{{- if not .Values.bootstrapOnly }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpu.fullname" . }}-migrate
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "gpu.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "gpu.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "gpu.image" (dict "root" . "component" "migrate") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- include "gpu.containerSecurity" . | nindent 12 }}
          env:
            {{- include "gpu.databaseEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
